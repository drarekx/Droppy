<!doctype html>
<!-- Droppy app icon ("Archivos sobre la bandeja"). Source of truth for
     Resources/AppIcon.icns: regenerate with scripts/make-icon.sh. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Droppy icon</title>
<style>
html, body { margin: 0; background: transparent; }
.icon { width: 1024px; height: 1024px; position: relative; }
.squircle { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
  background: linear-gradient(160deg, #4A7BF0 0%, #3566E0 55%, #2A52B8 100%);
  overflow: hidden; box-shadow: 0 18px 36px rgba(0,0,0,0.32); }
.file { position: absolute; width: 250px; height: 320px; border-radius: 26px; background: #FFFFFF;
  box-shadow: 0 22px 44px rgba(8,14,40,0.35); }
.file::before { content: ""; position: absolute; right: 0; top: 0; width: 70px; height: 70px;
  background: linear-gradient(225deg, #3566E0 50%, #D5DBE7 50%); border-top-right-radius: 26px; }
.file .line { position: absolute; left: 38px; height: 16px; border-radius: 8px; background: #D5DBE7; }
.f1 { left: 175px; top: 150px; transform: rotate(-14deg); }
.f2 { left: 400px; top: 115px; transform: rotate(10deg); }
.f3 { left: 290px; top: 175px; transform: rotate(-2deg); }
.f3 .thumb { position: absolute; left: 38px; top: 96px; width: 174px; height: 110px; border-radius: 12px;
  background: linear-gradient(180deg, #7AA2FF 0%, #7AA2FF 60%, #3D5BB0 60%); }
.f3 .sun { position: absolute; left: 150px; top: 112px; width: 34px; height: 34px; border-radius: 50%; background: #F5C46B; }
.tray { position: absolute; left: 130px; top: 470px; width: 564px; height: 250px; }
.tray .back { position: absolute; left: 0; top: 0; width: 564px; height: 250px; border-radius: 40px;
  background: #1B2F66; }
.tray .front { position: absolute; left: 0; top: 70px; width: 564px; height: 180px; border-radius: 0 0 40px 40px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E9EEF8 100%); box-shadow: 0 -6px 0 rgba(255,255,255,0.35) inset; }
.tray .slot { position: absolute; left: 182px; top: 70px; width: 200px; height: 64px; border-radius: 0 0 32px 32px;
  background: #1B2F66; }
.arrow { position: absolute; left: 456px; top: 80px; }
</style>
</head>
<body>
<div class="icon">
  <div class="squircle">
    <div class="file f1"><span class="line" style="top:110px;width:150px"></span><span class="line" style="top:150px;width:120px"></span><span class="line" style="top:190px;width:160px"></span></div>
    <div class="file f2"><span class="line" style="top:110px;width:160px"></span><span class="line" style="top:150px;width:110px"></span><span class="line" style="top:190px;width:140px"></span></div>
    <div class="tray">
      <div class="back"></div>
    </div>
    <div class="file f3"><span class="thumb"></span><span class="sun"></span><span class="line" style="top:236px;width:120px"></span></div>
    <div class="tray">
      <div class="front"><div class="slot"></div></div>
    </div>
  </div>
</div>
</body>
</html>
